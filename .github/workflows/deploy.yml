name: Deploy Golden Path

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-path-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "false"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_deployer_object_id: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure with Service Principal + Client Secret
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_VAR_project_name:?Create repository variable TF_PROJECT_NAME}"
          : "${TF_VAR_azure_deployer_object_id:?Create variable AZURE_PRINCIPAL_OBJECT_ID}"
          : "${ARM_CLIENT_ID:?Create secret AZURE_CLIENT_ID}"
          : "${ARM_CLIENT_SECRET:?Create secret AZURE_CLIENT_SECRET}"
          : "${ARM_TENANT_ID:?Create secret AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?Create secret AZURE_SUBSCRIPTION_ID}"

      - name: Terraform init and validate
        working-directory: terraform
        run: |
          terraform init
          terraform fmt -check
          terraform validate

      - name: Provision base infrastructure
        working-directory: terraform
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Read ACR name
        id: acr
        working-directory: terraform
        shell: bash
        run: echo "name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"

      - name: Build and push app image with ACR
        run: |
          az acr build \
            --registry "${{ steps.acr.outputs.name }}" \
            --image "golden-path-app:${{ github.sha }}" \
            ./app

      - name: Set deployed image and apply
        working-directory: terraform
        env:
          IMAGE_NAME: ${{ steps.acr.outputs.name }}.azurecr.io/golden-path-app:${{ github.sha }}
        run: |
          terraform plan -out=tfplan -var="image_name=$IMAGE_NAME"
          terraform apply -auto-approve tfplan

      - name: Show app URL
        working-directory: terraform
        run: |
          echo "## Golden Path deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Application URL: $(terraform output -raw container_app_url)" >> "$GITHUB_STEP_SUMMARY"
