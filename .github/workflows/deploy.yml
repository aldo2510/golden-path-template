name: Deploy Golden Path

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: aldo2510/platform-workflows/.github/workflows/deploy-azure-container-apps.yml@main
    with:
      project_name: ${{ vars.TF_PROJECT_NAME }}
      azure_deployer_object_id: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
      location: ${{ vars.AZURE_LOCATION || 'eastus' }}
      state_resource_group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      state_storage_account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      state_container: ${{ vars.TF_STATE_CONTAINER }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
