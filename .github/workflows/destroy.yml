name: Destroy Golden Path

on:
  workflow_dispatch:
    inputs:
      confirm_project_name:
        description: "Type the exact value of TF_PROJECT_NAME to confirm destruction"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate_confirmation:
    if: ${{ vars.TF_PROJECT_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate project name confirmation
        env:
          EXPECTED_PROJECT: ${{ vars.TF_PROJECT_NAME }}
          CONFIRMED_PROJECT: ${{ inputs.confirm_project_name }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_PROJECT" || "$CONFIRMED_PROJECT" != "$EXPECTED_PROJECT" ]]; then
            echo "Project name confirmation does not match TF_PROJECT_NAME."
            exit 1
          fi

  destroy:
    if: ${{ vars.TF_PROJECT_NAME != '' }}
    needs: validate_confirmation
    uses: aldo2510/platform-workflows/.github/workflows/destroy-azure-container-apps.yml@main
    with:
      project_name: ${{ vars.TF_PROJECT_NAME }}
      azure_deployer_object_id: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
      state_resource_group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      state_storage_account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      state_container: ${{ vars.TF_STATE_CONTAINER }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
