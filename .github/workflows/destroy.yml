name: Destroy Golden Path

on:
  workflow_dispatch:
    inputs:
      confirm_project_name:
        description: "Type the exact value of TF_PROJECT_NAME to confirm destruction"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: golden-path-destroy
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "false"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_deployer_object_id: ${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm destroy target
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm_project_name }}
        run: |
          set -euo pipefail
          : "${TF_VAR_project_name:?Create repository variable TF_PROJECT_NAME}"
          if [[ "$CONFIRMATION" != "$TF_VAR_project_name" ]]; then
            echo "Confirmation does not match TF_PROJECT_NAME. Nothing will be destroyed."
            exit 1
          fi

      - name: Login to Azure with Service Principal + Client Secret
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform destroy
        working-directory: terraform
        run: |
          terraform init
          terraform destroy -auto-approve
